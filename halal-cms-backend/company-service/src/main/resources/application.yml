server:
  port: 8085

spring:
  application:
    name: company-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/halalcms_companies}
    username: ${DB_USER:halalcms}
    password: ${DB_PASSWORD:halalcms}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:changeme-use-256-bit-secret-in-production}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
