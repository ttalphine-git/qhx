server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/halalcms}
    username: ${DB_USER:halal_user}
    password: ${DB_PASSWORD:halal@secure123}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:changeme-use-256-bit-secret-in-production}
  access-token-expiry: 28800
  refresh-token-expiry: 604800

app:
  init:
    admin-password: ${ADMIN_PASSWORD:admin123}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:sqxad@12098}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
