server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/halalcms_auth}
    username: ${DB_USER:halalcms}
    password: ${DB_PASSWORD:halalcms}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:changeme-use-256-bit-secret-in-production}
  access-token-expiry: 28800    # 8 hours
  refresh-token-expiry: 604800  # 7 days

app:
  init:
    admin-password: ${ADMIN_PASSWORD:admin123}
    super-admin-password: ${SUPER_ADMIN_PASSWORD:sqxad@12098}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
