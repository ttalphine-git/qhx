services:

  # ── Database ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: halalcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-halal_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-halal@secure123}
      POSTGRES_DB: halalcms_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-halal_user}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Microservices ─────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: halalcms-auth
    restart: unless-stopped
    environment:
      DB_URL: ${AUTH_DB_URL:-jdbc:postgresql://postgres:5432/halalcms_auth}
      DB_USER: ${DB_USER:-halal_user}
      DB_PASSWORD: ${DB_PASSWORD:-halal@secure123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-sqxad@12098}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: halalcms-application
    restart: unless-stopped
    environment:
      DB_URL: ${APPLICATION_DB_URL:-jdbc:postgresql://postgres:5432/halalcms_applications}
      DB_USER: ${DB_USER:-halal_user}
      DB_PASSWORD: ${DB_PASSWORD:-halal@secure123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    container_name: halalcms-company
    restart: unless-stopped
    environment:
      DB_URL: ${COMPANY_DB_URL:-jdbc:postgresql://postgres:5432/halalcms_companies}
      DB_USER: ${DB_USER:-halal_user}
      DB_PASSWORD: ${DB_PASSWORD:-halal@secure123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  inspection-service:
    build:
      context: ./inspection-service
      dockerfile: Dockerfile
    container_name: halalcms-inspection
    restart: unless-stopped
    environment:
      DB_URL: ${INSPECTION_DB_URL:-jdbc:postgresql://postgres:5432/halalcms_inspections}
      DB_USER: ${DB_USER:-halal_user}
      DB_PASSWORD: ${DB_PASSWORD:-halal@secure123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      SPRING_PROFILES_ACTIVE: prod
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@halalcertificationboard.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  certificate-service:
    build:
      context: ./certificate-service
      dockerfile: Dockerfile
    container_name: halalcms-certificate
    restart: unless-stopped
    environment:
      DB_URL: ${CERTIFICATE_DB_URL:-jdbc:postgresql://postgres:5432/halalcms_certificates}
      DB_USER: ${DB_USER:-halal_user}
      DB_PASSWORD: ${DB_PASSWORD:-halal@secure123}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      DO_SPACES_KEY: ${DO_SPACES_KEY:-}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET:-}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:-}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-nyc3}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend (nginx serves SPA + proxies API) ─────────────────────────
  frontend:
    build:
      context: ../halal-cms-frontend
      dockerfile: Dockerfile
    container_name: halalcms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - application-service
      - company-service
      - inspection-service
      - certificate-service
    networks:
      - halalcms-net

networks:
  halalcms-net:
    driver: bridge

volumes:
  postgres_data:
