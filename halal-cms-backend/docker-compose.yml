services:

  # ── Database ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: halalcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: halalcms_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Microservices ─────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: halalcms-auth
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/halalcms_auth
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  application-service:
    build:
      context: .
      dockerfile: application-service/Dockerfile
    container_name: halalcms-application
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/halalcms_applications
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  company-service:
    build:
      context: .
      dockerfile: company-service/Dockerfile
    container_name: halalcms-company
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/halalcms_companies
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  inspection-service:
    build:
      context: .
      dockerfile: inspection-service/Dockerfile
    container_name: halalcms-inspection
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/halalcms_inspections
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  certificate-service:
    build:
      context: .
      dockerfile: certificate-service/Dockerfile
    container_name: halalcms-certificate
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/halalcms_certificates
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DO_SPACES_KEY: ${DO_SPACES_KEY}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET}
      DO_SPACES_REGION: ${DO_SPACES_REGION}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - halalcms-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend (nginx serves SPA + proxies API) ─────────────────────────
  frontend:
    build:
      context: ../halal-cms-frontend
      dockerfile: Dockerfile
    container_name: halalcms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - application-service
      - company-service
      - inspection-service
      - certificate-service
    networks:
      - halalcms-net

networks:
  halalcms-net:
    driver: bridge

volumes:
  postgres_data:
