server:
  port: 8082

spring:
  application:
    name: application-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/halalcms_applications}
    username: ${DB_USER:halalcms}
    password: ${DB_PASSWORD:halalcms}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB

# Audit file upload configuration
audit:
  files:
    storage-path: ${AUDIT_FILES_PATH:/var/lib/halalcms/audit-reports}
    max-file-size: ${AUDIT_MAX_FILE_SIZE:52428800}

jwt:
  secret: ${JWT_SECRET:changeme-use-256-bit-secret-in-production}

eureka:
  client:
    enabled: false
