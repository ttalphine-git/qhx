server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:inspection_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 2525
    username:
    password:

jwt:
  secret: test-secret-key-that-is-at-least-32-bytes

eureka:
  client:
    enabled: false
