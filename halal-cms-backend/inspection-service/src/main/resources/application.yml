server:
  port: 8083
spring:
  application:
    name: inspection-service
  datasource:
    url: ${INSPECTION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/halalcms_inspections}}
    username: ${DB_USER:halal_user}
    password: ${DB_PASSWORD:halal@secure123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@halalcertificationboard.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
app:
  email:
    signature: "Halal Certification Board"
jwt:
  secret: ${JWT_SECRET:changeme-use-256-bit-secret-in-production}
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
