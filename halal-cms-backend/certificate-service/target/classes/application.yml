server:
  port: 8085

spring:
  application:
    name: certificate-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/halalcms_certificates}
    username: ${DB_USER:halalcms}
    password: ${DB_PASSWORD:halalcms}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:changeme-use-256-bit-secret-in-production}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
