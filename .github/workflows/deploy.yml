name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: registry.digitalocean.com/halalcms

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all JARs
        working-directory: halal-cms-backend
        run: mvn package -DskipTests -q

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 3600

      - name: Build & push Docker images
        working-directory: halal-cms-backend
        run: |
          services=(auth-service application-service company-service inspection-service certificate-service)
          for svc in "${services[@]}"; do
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --cache-from $REGISTRY/$svc:latest \
              -t $REGISTRY/$svc:${{ github.sha }} \
              -t $REGISTRY/$svc:latest \
              -f $svc/Dockerfile .
            docker push $REGISTRY/$svc:${{ github.sha }}
            docker push $REGISTRY/$svc:latest
          done

      - name: Build & push frontend image
        working-directory: halal-cms-frontend
        run: |
          docker build \
            -t $REGISTRY/frontend:${{ github.sha }} \
            -t $REGISTRY/frontend:latest .
          docker push $REGISTRY/frontend:${{ github.sha }}
          docker push $REGISTRY/frontend:latest

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/halalcms
            doctl registry login --expiry-seconds 3600
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
