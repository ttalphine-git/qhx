name: App Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-app-platform-config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify App Platform files
        run: |
          test -f package.json
          test -f package-lock.json
          test -f .do/app.yaml
          test -f halal-cms-frontend/Dockerfile
          test -f halal-cms-backend/auth-service/Dockerfile.app
          test -f halal-cms-backend/application-service/Dockerfile.app
          test -f halal-cms-backend/inspection-service/Dockerfile.app
          test -f halal-cms-backend/certificate-service/Dockerfile.app
          test -f halal-cms-backend/company-service/Dockerfile.app

      - name: Validate frontend install and build
        run: |
          npm ci
          npm --workspace halal-cms-frontend run build

      - name: Validate backend Maven packages
        working-directory: halal-cms-backend
        run: mvn package -DskipTests
