name: App Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-app-platform-config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify App Platform files
        run: |
          test -f package.json
          test -f package-lock.json
          test -f .do/app.yaml
          test -f halal-cms-frontend/Dockerfile
          test -f halal-cms-backend/auth-service/Dockerfile.app
          test -f halal-cms-backend/application-service/Dockerfile.app
          test -f halal-cms-backend/inspection-service/Dockerfile.app
          test -f halal-cms-backend/certificate-service/Dockerfile.app
          test -f halal-cms-backend/company-service/Dockerfile.app

      - name: Validate frontend install and build
        run: |
          npm ci
          npm --workspace halal-cms-frontend run build

      - name: Validate backend Maven packages
        working-directory: halal-cms-backend
        run: mvn package -DskipTests

  deploy-to-droplet:
    needs: validate-app-platform-config
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: droplet-deploy-main
      cancel-in-progress: true

    steps:
      - name: Deploy on Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 40m
          script: |
            set -e

            if ! command -v git >/dev/null 2>&1; then
              apt-get update
              apt-get install -y git
            fi

            mkdir -p /root

            if [ ! -d /root/qhx/.git ]; then
              rm -rf /root/qhx
              git clone https://github.com/ttalphine-git/qhx.git /root/qhx
            fi

            cd /root/qhx
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy-server.sh
            ./deploy-server.sh
